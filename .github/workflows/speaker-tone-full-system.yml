name: Full-system ARMv7 speaker tone

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-system-speaker-tone:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out ARM backend
        uses: actions/checkout@v4

      - name: Install cross-bootstrap and system-emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binfmt-support \
            clang \
            debootstrap \
            e2fsprogs \
            gcc-arm-linux-gnueabihf \
            lld \
            qemu-system-arm \
            qemu-user-static

      - name: Boot Ubuntu armhf and capture native speaker output
        run: sh tests/speaker/full-system-ubuntu.sh

      - name: Retain guest audio receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-armv7-speaker-tone
          path: |
            build/full-system-arm-speaker/serial.log
            build/full-system-arm-speaker/tone.wav
          if-no-files-found: warn
