name: ARMv7 speaker tone oracle

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  speaker-tone:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ARM backend
        uses: actions/checkout@v4

      - name: Install ARM assembly and user-emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld file qemu-user

      - name: Build and inspect native speaker-tone oracle
        run: sh tests/speaker/check.sh
