name: biology contrast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  biology-contrast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Find backend biology candidate
        id: candidate
        shell: sh
        run: |
          candidate="$GITHUB_WORKSPACE/.aici/biology-candidate"
          if [ -x "$candidate" ]; then
            echo "path=$candidate" >> "$GITHUB_OUTPUT"
            echo "Using backend candidate: $candidate"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No runnable backend candidate on this runner; running corpus/oracle gate."
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/bioawk
          ref: 94a826e0dae39178db1fe5a0e07e764caac37e5e
          path: _bioawk
      - name: Run shared branch/search biology gate
        uses: isomorphisms/ai-ci/biology@05f3976a36a4b9829a2748995a686b103cfdab18
        with:
          corpus_root: _bioawk/sample data
          candidate: ${{ steps.candidate.outputs.path }}
