name: verify

on:
  push:
    branches: [idric-ir-first-slice]
  pull_request:

concurrency:
  group: arm-thumb-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPLEX_PROJECTIVE_POLICY_SHA: 8e14cb50db10a055a0849e0ad7cab26454cd5791

jobs:
  arm-thumb:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Check out pinned Idriç compiler
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: 081b9cde0591154839fb5d80d76e5570e0436300
          path: Idric
          persist-credentials: false

      - name: Resolve current complex/projective semantic target
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: math/complex-projective-semantics
          path: IdricComplexSemantics
          persist-credentials: false

      - name: Check out merged receipt policy
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/ai-ci
          ref: ${{ env.COMPLEX_PROJECTIVE_POLICY_SHA }}
          path: .ai-ci-complex-policy
          persist-credentials: false

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ca-certificates clang lld file libgmp-dev qemu-user

      - name: Bootstrap pinned Idriç
        run: ./Idric/edric bootstrap

      - name: Install pinned Idriç libraries and compiler API
        run: |
          make -C Idric install-bootstrap-libs IDRIS2="$GITHUB_WORKSPACE/Idric/build/exec/idris2"
          make -C Idric install-api IDRIS2_BOOT="$GITHUB_WORKSPACE/Idric/build/exec/idris2"

      - name: Compile, inspect, assemble, and execute Thumb verification
        run: make verify IDRIC="$GITHUB_WORKSPACE/Idric/build/exec/idris2"

      - name: Record provisional complex/projective follower status
        run: |
          export IDRIC_COMPLEX_SEMANTICS_SHA=$(git -C IdricComplexSemantics rev-parse HEAD)
          scripts/write_complex_projective_follower_receipt.sh build/complex-projective-follower

      - name: Verify follower evidence claims against merged policy
        run: python3 .ai-ci-complex-policy/complex-projective/verify_receipt.py verify build/complex-projective-follower/receipt.tsv

      - name: Retain Thumb follower evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complex-projective-thumb-follower
          path: build/complex-projective-follower
          if-no-files-found: warn
